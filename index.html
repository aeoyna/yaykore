<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>SwipeCard - スワイプ単語カード</title>
  <meta name="description" content="スワイプで覚える単語カードアプリ。Quizletのように単語をスワイプして効率よく暗記できます。" />

  <!-- PWA / Mobile -->
  <meta name="theme-color" content="#0d0d14" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="SwipeCard" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.json" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+JP:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- ========== SCREEN: HOME ========== -->
  <div id="screen-home" class="screen active">
    <header class="app-header">
      <div class="logo">
        <div class="logo-icon">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <rect x="2" y="4" width="14" height="18" rx="3" fill="url(#g1)" opacity="0.9"/>
            <rect x="6" y="2" width="14" height="18" rx="3" fill="url(#g2)"/>
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#60a5fa"/>
                <stop offset="100%" stop-color="#1d4ed8"/>
              </linearGradient>
              <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0%" stop-color="#93c5fd"/>
                <stop offset="100%" stop-color="#3b82f6"/>
              </linearGradient>
            </defs>
          </svg>
        </div>
        <span class="logo-text">SwipeCard</span>
      </div>
      <div class="header-actions">
        <button id="btn-open-settings" class="btn-icon" title="設定">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
        <button id="btn-add-deck" class="btn-icon" title="デッキを追加">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>
          </svg>
        </button>
      </div>
    </header>

    <main class="home-main">
      <section class="hero">
        <h1 class="hero-title">スワイプで<br/><span class="gradient-text">単語を覚えよう</span></h1>
        <p class="hero-sub">右スワイプ → 覚えた　｜　左スワイプ → もう一度</p>
      </section>

      <section class="decks-section">
        <div class="section-header">
          <h2>デッキ一覧</h2>
          <span id="deck-count" class="badge">0 デッキ</span>
        </div>
        <div id="deck-list" class="deck-list"></div>
      </section>
    </main>
  </div>

  <!-- ========== SCREEN: STUDY ========== -->
  <div id="screen-study" class="screen">
    <!-- Particle Canvas Overlay -->
    <canvas id="particle-canvas" class="particle-canvas"></canvas>

    <header class="study-header">
      <button id="btn-back" class="btn-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"/>
        </svg>
      </button>
      <div class="study-header-center">
        <div id="study-deck-name" class="study-deck-name"></div>
        <div id="progress-bar-wrap" class="progress-bar-wrap">
          <div id="progress-bar" class="progress-bar"></div>
        </div>
      </div>
      <div id="progress-text" class="progress-text">0/0</div>
    </header>

    <main class="study-main">
      <!-- Stat badges -->
      <div class="study-stat-badges">
        <div class="stat-badge stat-badge-left" id="btn-show-learning" title="学習中の単語一覧を表示">
          <span class="stat-badge-num" id="badge-learning">0</span>
          <span class="stat-badge-label">学習中</span>
        </div>
        <div class="study-score-badge" id="btn-pachinko-score" title="スコア / ダブルクリックで確変デバッグ">
          <span class="score-badge-val" id="pachinko-score-val">00000</span>
          <span class="score-badge-label" id="score-badge-status-text">SCORE</span>
        </div>
        <div class="stat-badge stat-badge-right" id="btn-show-correct" title="覚えた単語一覧を表示">
          <span class="stat-badge-num" id="badge-correct">0</span>
          <span class="stat-badge-label">覚えた</span>
        </div>
      </div>

      <!-- Card Stack -->
      <div id="card-stack" class="card-stack">
        <!-- Cards injected by JS -->
      </div>

      <!-- Empty state -->
      <div id="study-complete" class="study-complete hidden">
        <div class="complete-icon">🎉</div>
        <h2>セッション完了！</h2>
        <div id="complete-stats" class="complete-stats"></div>
        <div class="complete-actions">
          <button id="btn-redo-wrong" class="btn-secondary">間違えた単語を復習</button>
          <button id="btn-redo-all" class="btn-primary">もう一度全部</button>
          <button id="btn-back-home" class="btn-ghost">ホームへ戻る</button>
        </div>
      </div>
    </main>

    <!-- ========== STUDY METRONOME ========== -->
    <div class="study-metronome" id="study-metronome">
      <div class="metro-left">
        <button id="btn-metro-toggle" class="metro-btn-play" title="メトロノームの再生/一時停止">
          <!-- Play Icon -->
          <svg class="icon-play" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
          <!-- Stop Icon -->
          <svg class="icon-stop hidden" width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
            <rect x="4" y="4" width="16" height="16" rx="2"></rect>
          </svg>
        </button>
        <div class="metro-dots">
          <!-- 動的に拍数のドットが追加されます -->
        </div>
      </div>
      <div class="metro-center">
        <input type="range" id="slider-metro-bpm" min="40" max="220" value="60" class="metro-slider">
        <span id="label-metro-bpm" class="metro-bpm-text">60 BPM</span>
      </div>
    </div>

    <!-- Action buttons -->
    <footer class="study-footer" id="study-footer">
      <button id="btn-flip" class="action-btn action-btn-flip" title="カードをめくる">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
      </button>
    </footer>
  </div>

  <!-- ========== MODAL: Add/Edit Deck ========== -->
  <div id="modal-deck" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-deck-title">新しいデッキ</h3>
        <button id="modal-deck-close" class="btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <label class="form-label" for="deck-name-input">デッキ名</label>
        <input id="deck-name-input" class="form-input" type="text" placeholder="例: TOEIC 基本単語" maxlength="50" />

        <label class="form-label" for="deck-emoji-input">アイコン (絵文字)</label>
        <div class="emoji-grid" id="emoji-grid"></div>

        <div class="cards-section">
          <div class="cards-section-header">
            <label class="form-label">単語カード</label>
            <button id="btn-add-card" class="btn-small">+ 追加</button>
          </div>
          <div id="cards-editor" class="cards-editor"></div>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-delete-deck" class="btn-danger hidden">削除</button>
        <div class="modal-footer-right">
          <button id="btn-cancel-deck" class="btn-ghost">キャンセル</button>
          <button id="btn-save-deck" class="btn-primary">保存</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: Settings ========== -->
  <div id="modal-settings" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3>アプリ設定</h3>
        <button id="modal-settings-close" class="btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <div class="setting-item">
          <label class="form-label">文字の大きさ</label>
          <div class="settings-options">
            <label class="radio-label">
              <input type="radio" name="font-size-option" value="standard" />
              <span>標準</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="font-size-option" value="large" />
              <span>大</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="font-size-option" value="extra" />
              <span>極大</span>
            </label>
          </div>
        </div>

        <div class="setting-item" style="margin-top: 20px;">
          <label class="form-label">単語のシャッフル</label>
          <label class="switch-label">
            <input type="checkbox" id="setting-shuffle-toggle" />
            <span class="switch-text">学習開始時に単語をシャッフルする</span>
          </label>
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-save-settings" class="btn-primary" style="width: 100%;">閉じる</button>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast hidden"></div>

  <!-- ========== MODAL: Card List ========== -->
  <div id="modal-card-list" class="modal-overlay hidden">
    <div class="modal-box">
      <div class="modal-header">
        <h3 id="modal-card-list-title">単語一覧</h3>
        <button id="modal-card-list-close" class="btn-icon">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>
      <div class="modal-body" style="max-height: 60vh; overflow-y: auto;">
        <div id="card-list-container" class="card-list-container">
          <!-- JSで動的に追加されます -->
        </div>
      </div>
      <div class="modal-footer">
        <button id="btn-close-card-list" class="btn-primary" style="width: 100%;">閉じる</button>
      </div>
    </div>
  </div>

  <!-- ========== MODAL: PACHINKO SLOT GACHA ========== -->
  <div id="modal-pachinko-slot" class="modal-overlay hidden" style="justify-content: center; align-items: center;">
    <div class="pachinko-modal-content">
      <div class="pachinko-modal-header">
        <span class="pachinko-modal-title" id="pachinko-modal-status">READY</span>
      </div>
      <div class="pachinko-modal-body">
        <div class="pachinko-screen" style="justify-content: center;">
          <div class="slot-reel" id="reel-0">3</div>
          <div class="slot-reel" id="reel-1">5</div>
          <div class="slot-reel" id="reel-2">9</div>
        </div>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
